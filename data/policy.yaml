# The candidate's decisions: what to apply to. Every stage (discovery, model review,
# applying) reads this one file. The candidate may edit it; the agent changes it
# only when she asks, and notes the date.

# Postings published in the last N days are applied to first; older postings that
# meet every other rule are still applied to, after them (2026-11-02: "30 天不是过滤条件，是优先选项").
freshDays: 30
# No senior, staff, principal or lead titles; a title that also offers a junior
# level ("Senior/Software Engineer", "[Junior / Senior]") stays (2026-11-01).
excludeSeniorTitles: true
# Only employers with H-1B filings since this year (DOL LCA data); no record, or
# a name no filer matches, stays in the catalog unapplied (2026-11-02).
h1bRequiredSince: 2023
# Titles never applied to: a title containing one of these, in any case, is out (2026-11-02).
excludeTitles: [analytics engineer]
# The ATS the agent applies on; the rest go on her own list (2026-10-30).
agentAts: [greenhouse]
# Every match within these rules is applied to without a per-posting approval (2026-11-02).
approveMatches: true
# How close a posting is to her background, from her resume (2026-11-02). Orders applying
# within fresh and within older postings (tier A first, then B, then C); it never excludes. Title hits count 3x, description 1x.
fit:
  strong: [computer vision, vision, perception, multimodal, multi-modal, foundation model, foundation models, representation learning, self-supervised, contrastive, image, video, imaging, robotics, robot, autonomous, autonomy, embodied, deep learning, research engineer, applied scientist, research scientist, machine learning engineer, ml engineer, evaluation, benchmark, agents, agentic, ai agent]
  good: [machine learning, pytorch, llm, llms, generative, training, inference, model, models, data scientist, statistics, statistical, modeling, python, ai engineer, new grad, entry level, early career]
  weak: [etl, dbt, tableau, power bi, looker, reporting, dashboards, salesforce, sap, frontend, front-end, react, ios, android, mobile, devops, kubernetes, terraform, sales, firmware, hardware, compliance, accounting]
  h1bVolume: 20
  tierA: 18
  tierB: 8

# Postings from these employers are recorded but never matched, queued or
# applied to. A name matches the employer's name as a whole word, so "Google"
# also covers "Google DeepMind".
excludeCompanies:
  - OpenAI
  - Anthropic
  - TikTok
  # ByteDance is TikTok's parent; the candidate (2026-10-30): no ByteDance/TikTok.
  - ByteDance
  - Google
