      identification at Arborphy AI. I adapted BioCLIP into an
      EfficientNet–BioCLIP dual-encoder with bidirectional spatial
      cross-attention, auxiliary organ supervision, and BioCLIP-anchored gated
      residuals to test whether biological semantic features and CNN image
      features were complementary. I evaluated it with controlled fusion
      experiments against single encoders, concatenation, and one-way versus
