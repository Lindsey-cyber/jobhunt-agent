    question: Describe a production ML or GenAI system where you did model-level
      work (training, fine-tuning, optimization, or evaluation) on a
      transformer-based model (GPT, Llama, Claude, Mistral, Gemma, or similar).
    answer: "I don’t want to overstate this: my documented transformer model-level
      work has been evaluation and interpretability research, not a production
      rollout. In Columbia AI Alignment Club, I worked on Qwen3-4B and Qwen3-8B:
      implementing activation hooks across 28 transformer layers, linear probes,
      steering interventions, randomized and sham controls, grouped-bootstrap
      controls, and response/token-level evaluations to test whether observed
      logit shifts reflected reliable hallucination or refusal behavior.
      Separately, I have deployment-facing experience from a real-time robotics
      system, where I optimized inference with ONNX Runtime, quantization,
      asynchronous video pipelines, and integrated a locally hosted language
      model through Ollama into the robot control workflow. For Databricks AI
      FDE, I would bring the evaluation rigor from the Qwen work together with
      practical inference and systems integration experience."
    company: Databricks
    jobTitle: ""
    origin: generated
    evidence:
      - Columbia AI Alignment Club - Technical
        Fellow                                               Feb 2025 – May 2025
      - Reproduced and critically evaluated Anthropic-style
        hallucination-circuit analysis in Qwen3-4B using pretrained transcoders
        and feature-attribution graphs, investigating candidate refusal-related
        mechanisms and limitations of circuit faithfulness.
      - Implemented activation hooks across 28 transformer layers, linear
        probes, and bidirectional steering scripts with randomized-direction,
        sham-intervention, and grouped-bootstrap controls; validated Qwen3-8B
        FP32 inference and Hugging Face–TransformerLens consistency, with logit
        discrepancies below 4.2 × 10−5 .
      - Designed controlled known-versus-unknown entity experiments on Qwen3-8B,
        evaluating 40 natural-language responses across matched prompt templates
        and multiple random seeds; identified unstable answer-withholding
        behavior that prevented progression to reliable causal circuit analysis.
      - Analyzed full-response semantics and token-level generation
        trajectories, identifying a shared-prefix case in which factual
        attribution and answer withholding diverged at the seventh generated
        token; demonstrated why first-token logit shifts cannot independently
        establish semantic hallucination effects.
      - Developed a real-time vision pipeline for an autonomous
        badminton-training robot, integrating YOLOv8-based player detection,
        pose estimation, shuttlecock tracking, and court localization, achieving
        20+ FPS.
      - Implemented stereo 3D shuttlecock tracking and landing-point prediction;
        optimized Raspberry Pi inference with ONNX Runtime, quantization, and
        asynchronous video pipelines.
      - Integrated a locally hosted language model through Ollama for
        voice-based robot commands and natural-language interaction, connecting
        user instructions with the robot’s control workflow.
