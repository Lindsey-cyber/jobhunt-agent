# Sources with no approved API. Listed so every report states they were skipped and why.
skipped:
  - { name: LinkedIn direct, reason: 'No approved jobs API; covered through LinkedIn alert emails in Gmail' }
  - { name: Indeed direct, reason: 'No approved jobs API; covered through Indeed alert emails in Gmail' }
  - { name: Glassdoor direct, reason: 'No approved jobs API; covered through Glassdoor alert emails in Gmail' }
  - { name: Handshake direct, reason: 'Needs an account integration; covered through Handshake emails in Gmail' }
  - { name: Wellfound, reason: 'Account authorization not configured' }
