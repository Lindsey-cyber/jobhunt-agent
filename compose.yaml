services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobhunt
      POSTGRES_DB: jobhunt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt -d jobhunt"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  agent:
    build: .
    restart: unless-stopped
    init: true
    shm_size: 1gb
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://jobhunt:${POSTGRES_PASSWORD}@db:5432/jobhunt
      AUTO_SUBMIT: "false"
      DISCOVERY_ONLY: "true"
      SCHEDULED_DISCOVERY: "false"
      DATA_DIR: /app/data
      PROFILE_PATH: /app/config/profile.json
      POLICIES_PATH: /app/config/policies.json
      RESUME_PATH: /app/config/resume.pdf
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?Set DASHBOARD_TOKEN in .env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - browser_data:/app/data
      - ./config:/app/config:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
volumes:
  postgres_data:
  browser_data:
