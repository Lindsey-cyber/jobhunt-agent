# The candidate's decisions: what to apply to. Every stage (discovery, model review,
# applying) reads this one file. The candidate may edit it; the agent changes it
# only when she asks, and notes the date.

# Only postings published in the last N days (2026-11-02).
windowDays: 30
# No senior, staff, principal or lead titles; a title that also offers a junior
# level ("Senior/Software Engineer", "[Junior / Senior]") stays (2026-11-01).
excludeSeniorTitles: true
# Only employers with H-1B filings since this year (DOL LCA data); no record, or
# a name no filer matches, stays in the catalog unapplied (2026-11-02).
h1bRequiredSince: 2023
# The ATS the agent applies on; the rest go on her own list (2026-10-30).
agentAts: [greenhouse]
# Every match within these rules is applied to without a per-posting approval (2026-11-02).
approveMatches: true
# Titles applied to after everything else (2026-11-02).
applyLast: [analytics engineer]

# Postings from these employers are recorded but never matched, queued or
# applied to. A name matches the employer's name as a whole word, so "Google"
# also covers "Google DeepMind".
excludeCompanies:
  - OpenAI
  - Anthropic
  - TikTok
  - Google
  - Palantir
