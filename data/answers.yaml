    question: What AI tools are you currently using today and how are you using them?
    answer: "Today, in my current Research Engineer Intern role at Arborphy AI, I’m
      using EfficientNet, BioCLIP, and DINOv3 to study plant-identification
      models and representation quality. I use frozen linear probes, clustering,
      nearest-neighbor retrieval, local PCA rotations, and centroid shrinkage to
      understand whether representations capture species identity, organ
      morphology, or photographic-scale confounding. I’m also building
      evaluation loops: individual- and species-disjoint benchmarks for species
      identification, organ classification, and cross-species retrieval, plus
      human-review sets for model errors. On the agent side, I’ve built a
      multi-agent botanical reasoning prototype with autonomous tool generation,
      visual-analysis agents, constrained planning, per-step information-gain
      evaluation, and knowledge-graph evidence aggregation. That maps closely to
      assistant quality work: retrieval, grounding, evaluation, and iterative
      improvement."
