name: Verify JobHunt
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: jobhunt
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: jobhunt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobhunt -d jobhunt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.6'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check jobhunt tests scripts
      - run: uv run python scripts/secret_scan.py
      - run: uv run pytest -q
      - run: uv run playwright install --with-deps chromium --only-shell
      - run: uv run pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://jobhunt:test-only-password@127.0.0.1:5432/jobhunt_test
          RUN_BROWSER_TESTS: '1'
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated Compose stack
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 240
          curl --fail http://127.0.0.1:8000/healthz
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down --volumes
